
name: Build RS ASSISTANCE APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build RS ASSISTANCE APK
        env:
          RS_APP_TOKEN: ${{ secrets.RS_APP_TOKEN }}
        run: gradle --no-daemon assembleDebug -PRS_APP_TOKEN="$RS_APP_TOKEN"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RS-ASSISTANCE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
